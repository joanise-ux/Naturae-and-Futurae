name: Deploy to OVH

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Na serwer idzie WYŁĄCZNIE katalog site/ — strona wizytówka Nature & Future
      # i Kamino BioLabs. Reszta repozytorium (stary sklep, panel klienta, strony
      # -nf, backupy, dokumentacja) zostaje w gicie, ale nie jest publikowana.
      #
      # Akcja synchronizuje serwer ze stanem site/: pliki, które wgrała wcześniej,
      # a których w site/ nie ma, usuwa z /www/. Pierwszy deploy po tej zmianie
      # zdejmie więc z serwera stary front.
      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ftp.cluster100.hosting.ovh.net
          username: nfplano
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./site/
          server-dir: /www/
